<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIFI SCANNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');

    :root {
      --bg-primary:  #0D0D0D;
      --bg-card:     #161616;
      --bg-input:    #1A1A1A;
      --border:      #2A2A2A;
      --green-neon:  #00FF41;
      --green-dim:   #2ECC71;
      --text:        #E0E0E0;
      --muted:       #666666;
      --label:       #888888;
      --white:       #FFFFFF;
      --yellow:      #FFD700;
      --error:       #FF3B30;
      --radius:      4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .shell {
      width: 100%;
      max-width: 380px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      background: #111;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .term-icon {
      width: 28px; height: 28px;
      border: 1px solid var(--label);
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text);
    }
    .topbar-title { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--white); }
    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      background: none; border: none; cursor: pointer; padding: 6px;
      color: var(--label); border-radius: 2px; display: flex; align-items: center;
    }
    .icon-btn:hover { color: var(--text); }
    .avatar {
      width: 32px; height: 32px; border: 1px solid var(--label);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--label);
    }

    /* SCROLL CONTENT */
    .content { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }

    /* TERMINAL BOX */
    .term-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    /* SECTION HEADER */
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--label);
      letter-spacing: 1.5px;
    }

    /* STATUS ROW */
    .status-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .status-indicator { display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-neon); }
    .live-badge { font-size: 11px; font-weight: 700; color: var(--green-neon); letter-spacing: 1px; }
    .status-text { font-size: 12px; font-weight: 700; color: var(--text); }

    /* TERMINAL BUTTON */
    .term-btn {
      width: 100%; background: none; border: 1px solid var(--text);
      color: var(--text); padding: 13px; border-radius: var(--radius);
      font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: 1.5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .term-btn:hover { background: rgba(255,255,255,0.04); }
    .term-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .term-btn.green {
      border-color: var(--green-neon); color: var(--green-neon);
      background: rgba(0,255,65,0.04);
    }
    .term-btn.green:hover { background: rgba(0,255,65,0.08); }

    /* NEARBY APS HEADER */
    .aps-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0;
    }
    .ch-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

    /* NETWORK CARD */
    .net-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .net-card:hover { border-color: #444; }
    .net-card.personal { border-color: var(--green-neon); background: rgba(0,255,65,0.03); }
    .net-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .net-ssid-wrap { display: flex; align-items: center; gap: 7px; }
    .net-ssid { font-size: 13px; font-weight: 700; color: var(--text); }
    .net-card.personal .net-ssid { color: var(--green-neon); font-size: 14px; font-weight: 800; }
    .signal { font-size: 12px; font-weight: 700; }
    .signal.good { color: var(--green-neon); }
    .signal.ok   { color: var(--green-dim); }
    .signal.weak { color: var(--yellow); }
    .net-row-bot { display: flex; justify-content: space-between; align-items: center; }
    .net-mac { font-size: 11px; color: var(--label); }
    .net-mac span { color: var(--muted); }
    .net-sec { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
    .copy-sm { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px; }
    .copy-sm:hover { color: var(--text); }
    .wifi-icon { color: var(--muted); font-size: 14px; }
    .personal .wifi-icon { color: var(--green-neon); }

    /* INPUTS */
    .input-label { font-size: 10px; color: var(--label); letter-spacing: 1.5px; margin-bottom: 6px; }
    .input-wrap {
      display: flex; align-items: center;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-input); padding: 9px 10px; margin-bottom: 12px;
    }
    .input-wrap input {
      flex: 1; background: none; border: none; outline: none;
      font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text);
    }
    .input-wrap input::placeholder { color: var(--muted); font-weight: 400; }

    /* OUTPUT BOX */
    .output-box {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-input); padding: 10px 12px;
    }
    .output-waiting { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; }
    .output-line { display: flex; margin-bottom: 3px; font-size: 12px; }
    .output-key { color: var(--muted); width: 100px; flex-shrink: 0; }
    .output-val { color: var(--text); font-weight: 700; }
    .output-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
    .output-derived { display: flex; justify-content: space-between; align-items: center; }
    .derived-val { font-size: 15px; font-weight: 800; color: var(--green-neon); letter-spacing: 1.5px; }
    .output-error { color: var(--error); font-size: 12px; }

    /* MINI BOX for term icon */
    .mini-icon-box {
      width: 24px; height: 24px; border: 1px solid var(--label);
      border-radius: 2px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--label);
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #222; color: var(--green-neon); padding: 8px 18px;
      border-radius: 4px; font-size: 12px; border: 1px solid var(--green-neon);
      display: none; z-index: 100; letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="term-icon">▣</div>
      <span class="topbar-title">WIFI SCANNER</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="renderAll()" title="Actualizar">↻</button>
      <div class="avatar">👤</div>
    </div>
  </div>

  <div class="content">

    <!-- STATUS BLOCK -->
    <div class="term-box">
      <div class="section-header">
        <span class="section-title">// STATUS:</span>
        <div class="status-indicator">
          <div class="dot"></div>
        </div>
      </div>
      <div class="status-row">
        <span class="status-text" id="statusText">IDLE_MONITOR</span>
        <span class="live-badge">LIVE_FEED</span>
      </div>
      <button class="term-btn" id="scanBtn" onclick="scanNetworks()">
        <span>◎</span> ESCANEAR REDES WI-FI
      </button>
    </div>

    <!-- NEARBY APS -->
    <div class="aps-header">
      <span class="section-title" id="apsHeader">// NEARBY_APS (0)</span>
      <span class="ch-label">CH: AUTO</span>
    </div>

    <div id="networksList" style="display:flex; flex-direction:column; gap:8px;"></div>

    <!-- ANALYSIS MODULE -->
    <div class="term-box">
      <div class="section-header">
        <span class="section-title">// ANALYSIS_MODULE</span>
        <div class="mini-icon-box">▶</div>
      </div>

      <div class="input-label">TARGET SSID</div>
      <div class="input-wrap">
        <input type="text" id="ssid" placeholder="Ingresa el SSID..." oninput="runAlgorithm()">
        <button class="copy-sm" onclick="copyField('ssid')">⎘</button>
      </div>

      <div class="input-label">TARGET MAC ADDRESS</div>
      <div class="input-wrap">
        <input type="text" id="mac" placeholder="XX:XX:XX:XX:XX:XX" oninput="runAlgorithm()">
        <button class="copy-sm" onclick="copyField('mac')">⎘</button>
      </div>

      <button class="term-btn" onclick="runAlgorithmFromBtn()" style="margin-bottom:14px;">
        <span>⚡</span> EJECUTAR ALGORITMO
      </button>

      <div class="section-title" style="margin-bottom:8px;">// ALGORITHM_OUTPUT</div>
      <div class="output-box" id="outputBox">
        <div class="output-waiting">
          <span>-- WAITING_EXECUTION --</span>
          <span>⎘</span>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">COPIADO</div>

<script>
  const SAMPLE = [
    { ssid: "Personal-E60 2.4ghz", mac: "20:35:43:2F:4E:65", signal: -64, caps: "WPA2" },
    { ssid: "Fibertel-WiFi 5g",    mac: "AA:BB:CC:DD:EE:FF", signal: -42, caps: "WPA3" },
    { ssid: "Movistar-Plus",       mac: "10:20:30:40:50:60", signal: -78, caps: "WPA2" },
    { ssid: "personal-flow-9A",    mac: "44:55:66:77:88:99", signal: -68, caps: "WPA2" },
    { ssid: "Telecentro-4G",       mac: "CC:DD:EE:FF:00:11", signal: -81, caps: "WPA3" }
  ];

  let networks = [];

  function signalClass(s) {
    if (s >= -55) return 'good';
    if (s >= -70) return 'ok';
    return 'weak';
  }

  function renderNetworks() {
    const sorted = [...networks].sort((a, b) => {
      const ap = a.ssid.toLowerCase().startsWith('personal');
      const bp = b.ssid.toLowerCase().startsWith('personal');
      if (ap && !bp) return -1;
      if (!ap && bp) return 1;
      return b.signal - a.signal;
    });

    document.getElementById('apsHeader').textContent = `// NEARBY_APS (${sorted.length})`;
    const container = document.getElementById('networksList');
    container.innerHTML = sorted.map(n => {
      const isP = n.ssid.toLowerCase().startsWith('personal');
      return `
        <div class="net-card ${isP ? 'personal' : ''}" onclick="selectNetwork('${n.ssid}','${n.mac}')">
          <div class="net-row-top">
            <div class="net-ssid-wrap">
              <span class="wifi-icon">▲</span>
              <span class="net-ssid">${n.ssid}</span>
            </div>
            <span class="signal ${signalClass(n.signal)}">${n.signal} dBm</span>
          </div>
          <div class="net-row-bot">
            <span class="net-mac"><span>MAC:</span> ${n.mac.toUpperCase()}</span>
            <span class="net-sec">${n.caps} <button class="copy-sm" onclick="event.stopPropagation();copyText('${n.mac}')">⎘</button></span>
          </div>
        </div>`;
    }).join('');
  }

  function selectNetwork(ssid, mac) {
    document.getElementById('ssid').value = ssid;
    document.getElementById('mac').value = mac;
    runAlgorithm();
    showToast('SELECCIONADO: ' + ssid);
  }

  function scanNetworks() {
    const btn = document.getElementById('scanBtn');
    const st = document.getElementById('statusText');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">◌</span> SCANNING_NETWORKS...';
    st.textContent = 'SCANNING...';

    setTimeout(() => {
      networks = [...SAMPLE];
      renderNetworks();
      btn.disabled = false;
      btn.innerHTML = '◎  ESCANEAR REDES WI-FI';
      st.textContent = 'SCAN_COMPLETE';
    }, 1500);
  }

  function copyField(id) {
    const val = document.getElementById(id).value;
    if (val) { navigator.clipboard.writeText(val); showToast('COPIADO'); }
  }

  function copyText(t) {
    navigator.clipboard.writeText(t);
    showToast('COPIADO');
  }

  function runAlgorithmFromBtn() {
    const s = document.getElementById('ssid').value.trim();
    const m = document.getElementById('mac').value.trim();
    if (!s && !m) {
      document.getElementById('ssid').value = 'Personal-E60';
      document.getElementById('mac').value  = '20:35:43:2F:4E:65';
    }
    runAlgorithm();
  }

  function runAlgorithm() {
    const ssid = document.getElementById('ssid').value.trim();
    const mac  = document.getElementById('mac').value.trim();
    const box  = document.getElementById('outputBox');

    if (!ssid && !mac) {
      box.innerHTML = `<div class="output-waiting"><span>-- WAITING_EXECUTION --</span><span>⎘</span></div>`;
      return;
    }

    const cleanMac = mac.replace(/[:\-]/g,'').toUpperCase();
    if (!/^[0-9A-F]{12}$/.test(cleanMac)) {
      box.innerHTML = `<div class="output-error">> ERR: MAC inválida (se esperan 12 hex). Actual: '${cleanMac}' (${cleanMac.length} chars)</div>`;
      return;
    }

    const macTrim = cleanMac.substring(2);
    const di = ssid.lastIndexOf('-');
    if (di === -1 || di === ssid.length - 1) {
      box.innerHTML = `<div class="output-error">> ERR: SSID debe contener guión '-' seguido del sufijo. Ej: Personal-E60</div>`;
      return;
    }

    const suffix = ssid.substring(di + 1).toUpperCase();
    if (suffix.length > macTrim.length) {
      box.innerHTML = `<div class="output-error">> ERR: Sufijo '${suffix}' más largo que MAC recortada (${macTrim.length} chars)</div>`;
      return;
    }

    const n = suffix.length;
    const prefix = macTrim.substring(0, macTrim.length - n);
    const derived = prefix + suffix;

    box.innerHTML = `
      <div class="output-line"><span class="output-key">> MAC_CLEAN:</span><span class="output-val">${cleanMac}</span></div>
      <div class="output-line"><span class="output-key">> MAC_TRIM: </span><span class="output-val">${macTrim}</span></div>
      <div class="output-line"><span class="output-key">> SUFFIX:   </span><span class="output-val">${suffix}</span></div>
      <div class="output-line"><span class="output-key">> PREFIX:   </span><span class="output-val">${prefix}</span></div>
      <hr class="output-divider">
      <div class="output-derived">
        <div><span class="output-key">> DERIVED:  </span><span class="derived-val">${derived}</span></div>
        <button class="copy-sm" onclick="navigator.clipboard.writeText('${derived}');showToast('RESULTADO COPIADO')" style="color:var(--green-neon); font-size:14px;">⎘</button>
      </div>
    `;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1800);
  }

  function renderAll() {
    networks = [...SAMPLE];
    renderNetworks();
  }

  window.onload = () => {
    renderAll();
    document.getElementById('ssid').value = 'Personal-E60';
    document.getElementById('mac').value  = '20:35:43:2F:4E:65';
    runAlgorithm();
  };
</script>
</body>
</html>
